{% extends "attendance/base.html" %}

{% block content %}
<style>
    .page { max-width: 850px; margin: 0 auto; }
    .card { background:white; padding:32px; border-radius:18px; box-shadow:0 6px 24px rgba(0,0,0,.07); }
    .card h1 { margin:0 0 7px; }
    .muted { color:#6b7280; margin-top:0; margin-bottom:28px; }
    .field { margin-bottom:18px; }
    .field label { display:block; font-weight:700; margin-bottom:7px; }
    .form-input { width:100%; padding:12px 14px; border:1px solid #d1d5db; border-radius:9px; font-size:15px; outline:none; }
    .form-input:focus { border-color:#2563eb; box-shadow:0 0 0 3px rgba(37,99,235,.1); }
    .two { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .actions { display:flex; gap:10px; margin-top:26px; }
    .save, .cancel { padding:12px 18px; border-radius:9px; font-weight:700; text-decoration:none; cursor:pointer; }
    .save { border:0; background:#2563eb; color:white; }
    .cancel { background:#e5e7eb; color:#374151; }
    .error { color:#b91c1c; font-size:13px; margin-top:5px; }
    @media(max-width:650px) { .two { grid-template-columns:1fr; } .card { padding:22px; } }
</style>
<div class="page">
    <div class="card">
        <h1>Add Event</h1>
        <p class="muted">Create the event that students will check into.</p>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="field">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}<div class="error">{{ error }}</div>{% endfor %}
                </div>
            {% endfor %}
            <div class="actions">
                <button class="save" type="submit">+ Create Event</button>
                <a class="cancel" href="{% url 'dashboard' %}">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
