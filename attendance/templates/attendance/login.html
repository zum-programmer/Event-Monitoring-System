{% extends "attendance/base.html" %}

{% block content %}
<div style="max-width:420px;margin:70px auto;">
    <div style="background:white;padding:35px;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.08);">

        <h1 style="text-align: center;">Login</h1>

        <p></p>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button
                type="submit"
                style="width:100%;padding:12px;background:#2563eb;color:white;border:0;border-radius:8px;font-weight:bold;"
            >
                Login
            </button>
        </form>

        <p style="margin-top:20px;font-size:13px;color:#6b7280;text-align:center;">
            Developed By
            <br>
            <strong>Maverick Reyes</strong>
        </p>

    </div>
</div>
{% endblock %}
